name: Cross-platform checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r portable/requirements.txt
      - name: Linux tests including GUI
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Windows and macOS tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Linux installer syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/install-linux.sh scripts/uninstall-linux.sh
      - name: Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install-windows.ps1', 'scripts/uninstall-windows.ps1', 'scripts/setup-network-windows.ps1', 'native/windows_network_helper.ps1', 'tests/integration/windows_network.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Linux installer smoke test
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-linux.sh
          "$HOME/.local/bin/claudeguard" --config "$RUNNER_TEMP/installed-config.json" set ip_check_mode http
          "$HOME/.local/bin/claudeguard" --config "$RUNNER_TEMP/installed-config.json" add-ip 203.0.113.10
      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-windows.ps1
          $Python = Join-Path $env:LOCALAPPDATA 'ClaudeGuard\venv\Scripts\python.exe'
          $Entry = Join-Path $env:LOCALAPPDATA 'ClaudeGuard\portable\main.py'
          $Config = Join-Path $env:RUNNER_TEMP 'installed-config.json'
          & $Python $Entry --config $Config set ip_check_mode http
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          & $Python $Entry --config $Config add-ip 203.0.113.10
          if ($LASTEXITCODE -ne 0) { throw 'Installed configuration failed' }

      - name: Linux kernel network enforcement integration
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          sudo /usr/bin/python3 tests/integration/linux_network.py
      - name: Windows WFP enforcement integration
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: powershell
        run: ./tests/integration/windows_network.ps1
